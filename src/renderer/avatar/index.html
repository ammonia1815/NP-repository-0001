<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Avatar</title>
<link rel="stylesheet" href="avatar.css" />
</head>
<body>
<div id="avatar-container">
  <canvas id="avatar-canvas" width="384" height="672"></canvas>
  <div id="avatar-fallback">
    <span id="fallback-emoji">🙂</span>
    <span id="fallback-label">idle</span>
  </div>
  <button id="chat-toggle" class="overlay-btn" title="대화하기">💬</button>
  <button id="history-toggle" class="overlay-btn" title="날짜별 대화 기록">📅</button>
  <button id="menu-toggle" class="overlay-btn" title="메뉴">☰</button>
  <button id="tts-toggle" class="overlay-btn" title="음성 켜기/끄기">🔊</button>
  <button id="visibility-toggle" class="overlay-btn" title="버튼 항상 보이기 켜기/끄기">📌</button>
  <button id="screenview-toggle" class="overlay-btn" title="화면 확인 켜기/끄기">👁</button>
  <button id="provider-toggle" class="overlay-btn" title="응답 모델 선택">⚡</button>
  <div id="provider-menu">
    <button id="provider-gemini" class="provider-option" title="Gemini">⚡</button>
    <button id="provider-gemini-fast" class="provider-option" title="Gemini 고속 모드 (검색모션 없음, 더 저렴하고 빠름)">💨</button>
    <button id="provider-claude" class="provider-option" title="Claude Sonnet">🧠</button>
    <button id="provider-local" class="provider-option" title="로컬 모델">🦙</button>
  </div>
</div>
<script src="avatar.js"></script>
</body>
</html>
